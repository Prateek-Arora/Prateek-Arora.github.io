title: Prateek Arora
description: Notes on software I build and learn from, on AI, distributed systems, databases, and the rest of tech.
lang: en
url: "https://prateek-arora.github.io"
baseurl: ""
timezone: Asia/Kolkata
permalink: /:year/:month/:title/

author:
  name: Prateek Arora
  url: https://prateek-arora.github.io

# Shown in the header of the home page and the footer, in this order. Add a line to show a profile.
# Every link carries rel="me", which is what Mastodon checks to verify the website on a profile.
links:
  - name: GitHub
    url: https://github.com/Prateek-Arora
  - name: Bluesky
    url: https://bsky.app/profile/aroraprateek.bsky.social
  - name: Mastodon
    url: https://mastodon.social/@prateekarora

# jekyll-seo-tag: sameAs in the JSON-LD. Keep in step with links above.
social:
  name: Prateek Arora
  links:
    - https://github.com/Prateek-Arora
    - https://bsky.app/profile/aroraprateek.bsky.social
    - https://mastodon.social/@prateekarora

plugins:
  - jekyll-feed
  - jekyll-seo-tag

kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
    values:
      image: /assets/og/default.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
