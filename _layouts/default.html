<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
{% include head.html %}
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header wrap">
  <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <nav aria-label="Site">
    <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Writing</a>
    <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
  </nav>
</header>
<main id="main" class="wrap">
{{ content }}
</main>
<footer class="site-footer wrap">
  {% include links.html %}
  <p>© {{ site.time | date: '%Y' }} {{ site.author.name }}. No cookies or trackers on this site.</p>
</footer>
</body>
</html>
